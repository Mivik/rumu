[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.1.0"
description = "A small, calm AI agent with a good memory. Built in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mivik/rumu"

[workspace.dependencies]
rumu-core = { path = "crates/rumu-core" }
rumu-blob = { path = "crates/rumu-blob" }
rumu-cards = { path = "crates/rumu-cards" }
rumu-kernel = { path = "crates/rumu-kernel" }
rumu-store = { path = "crates/rumu-store" }
rumu-llm = { path = "crates/rumu-llm" }
rumu-plugins = { path = "crates/rumu-plugins" }
# Pins its schema crate exactly: bump both together.
agent-client-protocol = { version = "5.3.0", features = ["stdio", "unstable_end_turn_token_usage"] }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
futures-util = "0.3"
genai = "0.7.5"
gix = { version = "0.90", default-features = false, features = ["index", "sha1"] }
globset = "0.4"
imara-diff = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jiff = "1.0"
json-patch = "5"
matchit = "0.8"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-session", "job-object"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
rquickjs = "0.14"
rust-embed = { version = "8", features = ["mime-guess"] }
tower-http = { version = "0.7", features = ["fs"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
typed-path = "0.13"
tokio-util = "0.7"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Image decoding, scaling and encoding are unusably slow unoptimized (over a
# second per image); rumu-blob instantiates the generic parts.
[profile.dev.package]
image.opt-level = 3
png.opt-level = 3
fdeflate.opt-level = 3
zune-jpeg.opt-level = 3
rumu-blob.opt-level = 3
