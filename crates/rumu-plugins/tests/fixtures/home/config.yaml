# rumu configuration: workspace presets and external plugins in one file.
# Card frontmatter `scope:` relates cards to workspaces and files.
default: proj
workspaces:
  proj: ~/code/proj          # string shorthand: a local read-write root
  # app:
  #   ssh: deploy@prod           # optional: [user@]host; omitted = local
  #   root: /srv/app             # absolute on the ssh host
  #   read_only: true            # optional: default false

plugins:                         # external stdio plugins
  - name: clock
    cmd: [python3, plugins/clock.py]
  - name: compact
    cmd: [python3, plugins/compact.py]
